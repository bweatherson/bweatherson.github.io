    <path d="M 8,60 L 412,60" stroke="#444444" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 120,60 C 155,60 155,150 190,150 L 235,150" stroke="#444444" stroke-width="5" fill="none" stroke-linecap="round"/>
