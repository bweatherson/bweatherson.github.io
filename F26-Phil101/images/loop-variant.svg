<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 238" width="900" height="238"
     role="img" aria-label="Two track diagrams side by side. In Bystander at the Switch the side track is a dead end. In The Loop an extra segment of track, highlighted, curves back and rejoins the main line before the five.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
