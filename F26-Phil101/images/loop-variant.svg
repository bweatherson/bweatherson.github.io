    <circle cx="340" cy="43" r="5.2" fill="#333333"/><rect x="335.9" y="48" width="8.2" height="12" rx="4.1" fill="#333333"/>
    <circle cx="360" cy="43" r="5.2" fill="#333333"/><rect x="355.9" y="48" width="8.2" height="12" rx="4.1" fill="#333333"/>
    <circle cx="380" cy="43" r="5.2" fill="#333333"/><rect x="375.9" y="48" width="8.2" height="12" rx="4.1" fill="#333333"/>
    <circle cx="400" cy="43" r="5.2" fill="#333333"/><rect x="395.9" y="48" width="8.2" height="12" rx="4.1" fill="#333333"/>
    <text x="358" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">five</text>
    <circle cx="200" cy="133" r="5.2" fill="#333333"/><rect x="195.9" y="138" width="8.2" height="12" rx="4.1" fill="#333333"/>
    <text x="200" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#222222">one</text>
